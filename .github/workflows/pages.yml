name: Deploy documentation to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Reviewed full SHA at the current release tip
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Verify exact reviewed release source
        run: node scripts/verify_publication_source.mjs
        env:
          DOCS_RELEASE_SHA: ${{ inputs.release_sha }}
          DOCS_RUN_REF: ${{ github.ref }}
          DOCS_RUN_SHA: ${{ github.sha }}
          DOCS_EVENT_NAME: ${{ github.event_name }}
      - name: Install dependencies
        run: npm ci
      - name: Test publication source guard
        run: npm run test:publication
      - name: Check content and configuration
        run: npm run check
      - name: Build Starlight site
        run: npm run build
        env:
          DOCS_SITE_URL: https://docs.fulstech.com
          DOCS_BASE_PATH: /
      - name: Audit built links and assets
        run: npm run audit:build
        env:
          DOCS_BASE_PATH: /
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out verified artifact source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Recheck release tip before public deployment
        run: node scripts/verify_publication_source.mjs
        env:
          DOCS_RELEASE_SHA: ${{ inputs.release_sha }}
          DOCS_RUN_REF: ${{ github.ref }}
          DOCS_RUN_SHA: ${{ github.sha }}
          DOCS_EVENT_NAME: ${{ github.event_name }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
