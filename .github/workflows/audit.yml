name: Audit GitBook migration

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compare published GitBook with committed source
        run: python scripts/audit_migration.py --output migration-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-audit
          path: migration-audit.json
